[project]
name = "linkedin-safe-mcp"
version = "0.1.0"
description = "MCP server for LinkedIn: official-API posting, account-safe job search, and a local application tracker for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ankush" }]
keywords = ["mcp", "linkedin", "model-context-protocol", "job-search", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "mcp>=2.0.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
]

[project.scripts]
linkedin-safe-mcp = "linkedin_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/AmmYoo7/linkedin-safe-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
