services:
  linkedin-safe-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-safe-mcp:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    mem_limit: 512m
    environment:
      LINKEDIN_CLIENT_ID: "${LINKEDIN_CLIENT_ID:-}"
      LINKEDIN_CLIENT_SECRET: "${LINKEDIN_CLIENT_SECRET:-}"
      LINKEDIN_MCP_HOST: 0.0.0.0
      LINKEDIN_MCP_PORT: "8000"
      LINKEDIN_MCP_ALLOWED_HOSTS: "${LINKEDIN_MCP_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*}"
      LINKEDIN_MCP_ALLOWED_ORIGINS: "${LINKEDIN_MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*}"
      LINKEDIN_MCP_DIR: /data
      LINKEDIN_OPEN_BROWSER: "false"
      LINKEDIN_REDIRECT_BIND_HOST: 0.0.0.0
      LINKEDIN_REDIRECT_PORT: "8765"
    ports:
      - "127.0.0.1:${LINKEDIN_MCP_HOST_PORT:-8000}:8000"
      - "127.0.0.1:${LINKEDIN_REDIRECT_HOST_PORT:-8765}:8765"
    volumes:
      - linkedin-safe-mcp-data:/data
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  linkedin-safe-mcp-data:
