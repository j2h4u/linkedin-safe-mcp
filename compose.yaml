services:
  linkedin-safe-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkedin-safe-mcp:local
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    mem_limit: 512m
    env_file:
      - "${HOME}/.secrets/linkedin.env"
    environment:
      LINKEDIN_MCP_HOST: 0.0.0.0
      LINKEDIN_MCP_PORT: "8000"
      LINKEDIN_MCP_ALLOWED_HOSTS: linkedin-safe-mcp,linkedin-safe-mcp:8000
      LINKEDIN_MCP_DIR: /data
      LINKEDIN_OPEN_BROWSER: "false"
      # Docker publishes this listener only on the host loopback interface.
      LINKEDIN_REDIRECT_BIND_HOST: 0.0.0.0
      LINKEDIN_REDIRECT_PORT: "8765"
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - linkedin-safe-mcp-data:/data
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=64m"
    networks:
      - mcp-private-noauth
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  linkedin-safe-mcp-data:

networks:
  mcp-private-noauth:
    external: true
    name: mcp-private-noauth
